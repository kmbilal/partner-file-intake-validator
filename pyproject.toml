[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "partner-file-intake-validator"
version = "0.1.0"
description = "Partner file intake validation engine (local demo + serverless deployment later)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "boto3",
  "python-dateutil",
  "pydantic"
]

[project.optional-dependencies]
dev = [
  "pytest"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
